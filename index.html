<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6096bc">
<title>Berk'e ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#6096bc; --sky:#98c8e1; --butter:#fce59f; --pink:#fc9fc3; --pink-d:#f27fb0;
    --plum:#3b1f2b; --cream:#fff7e6;
    --c1:#f47fb0; --c2:#9cc73a; --c3:#f39a3d; --c4:#9b6fd1; --c5:#4f8fcf;
    --w: min(70vw, 50vh, 360px);       /* envelope width */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--blue)}
  body{
    font-family:"Grandstander",system-ui,sans-serif;color:var(--plum);
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  }

  /* ---------- watercolor sky ---------- */
  .sky{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(60% 45% at 18% 30%, #6fa3cc 0%, transparent 70%),
      radial-gradient(55% 40% at 85% 70%, #5687b3 0%, transparent 70%),
      radial-gradient(70% 50% at 50% 105%, #7cb1d6 0%, transparent 70%),
      var(--blue);}
  .sky{background-size:cover;background-position:center}
  .cloud{position:absolute;left:-5%;right:-5%;top:-2px;height:clamp(60px,11vh,110px);}
  .cloud svg{width:100%;height:100%}

  .bgstar{position:absolute;will-change:transform;width:var(--s);height:var(--s);animation:twinkle var(--d,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
  @keyframes twinkle{0%,100%{transform:rotate(-8deg) scale(.9)}50%{transform:rotate(10deg) scale(1.08)}}

  /* ---------- stage ---------- */
  .stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px}

  /* ---------- papers ---------- */
  .paper{position:absolute;will-change:transform;width:min(84vw,420px);aspect-ratio:4/5;
    background:var(--cream);border-radius:6px 9px 5px 8px;
    box-shadow:0 2px 0 rgba(59,31,43,.08),0 18px 40px -12px rgba(30,40,80,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:12% 8%;transform:rotate(var(--r));
    transition:transform 1s cubic-bezier(.6,-0.15,.35,1), opacity 1s ease;}
  .paper::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.55),transparent 60%),radial-gradient(100% 80% at 80% 100%,rgba(222,196,150,.18),transparent 70%)}
  .tape{position:absolute;top:-14px;left:50%;width:34%;height:30px;transform:translateX(-50%) rotate(var(--tr,-4deg));
    background:repeating-linear-gradient(90deg,rgba(252,159,195,.85) 0 10px,rgba(255,190,214,.85) 10px 20px);
    clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 50%);opacity:.92}
  .tape.butter{background:repeating-linear-gradient(90deg,rgba(252,229,159,.9) 0 10px,rgba(255,240,195,.9) 10px 20px)}
  .paper .doodle{position:absolute;width:13%;height:auto;aspect-ratio:1}
  #p1{--r:-2.5deg;z-index:3}
  #p2{--r:3deg;z-index:2}
  .paper.out-left{transform:translate(-135vw,8vh) rotate(-28deg)}
  .paper.out-right{transform:translate(135vw,6vh) rotate(26deg)}

  .msg{text-align:center;line-height:1.08;font-weight:800;letter-spacing:.02em;position:relative}
  #p1 .msg{font-size:clamp(30px,10.3vw,56px)}
  #p2 .msg{font-size:clamp(28px,10.6vw,52px)}
  .word{display:inline-block;white-space:nowrap;margin:0 .14em}
  .ch{display:inline-block;color:var(--col);
    -webkit-text-stroke:.07em var(--plum);paint-order:stroke fill;
    transform:translateY(var(--y)) rotate(var(--rot));
    clip-path:inset(-30% 110% -30% -15%);}
  .ch.on{animation:ink var(--t,.16s) ease-out forwards}
  @keyframes ink{to{clip-path:inset(-30% -15% -30% -15%)}}
  .line{display:block}
  .big{font-size:1.3em}

  .squiggle{display:block;margin:.35em auto 0;width:70%;height:.5em;overflow:visible}
  .squiggle path, .heartdraw path{fill:none;stroke:var(--pink-d);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);}
  .drawn path{transition:stroke-dashoffset .8s ease-in-out;stroke-dashoffset:0}
  .heartdraw{display:inline-block;width:.85em;height:.8em;vertical-align:-.05em;margin-left:.1em;overflow:visible}
  .heartdraw path{stroke:var(--plum);stroke-width:6;fill:var(--c1);fill-opacity:0;transition:stroke-dashoffset .8s ease-in-out, fill-opacity .4s .7s}
  .heartdraw.drawn path{fill-opacity:1}

  /* ---------- envelope ---------- */
  .envwrap{position:absolute;will-change:transform,opacity;width:var(--w);aspect-ratio:100/142;opacity:0;
    transform:translateY(24px) scale(.88);transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .6s ease}
  .envwrap.show{opacity:1;transform:none}
  .envwrap.sink{transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .9s ease .1s;
    transform:translateY(calc(var(--w) * .66))}
  .envwrap.gone{transition:transform 1.1s cubic-bezier(.6,0,.4,1),opacity .8s ease;
    transform:translateY(80vh) rotate(6deg);opacity:0}

  .env{position:absolute;inset:0;cursor:pointer}
  .idle .env{animation:float 3.2s ease-in-out infinite;will-change:transform}
  .idle .wig{animation:wiggle 3.2s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes wiggle{0%,62%,100%{transform:rotate(0)}66%{transform:rotate(-4deg)}71%{transform:rotate(3.5deg)}76%{transform:rotate(-2.5deg)}81%{transform:rotate(1.5deg)}86%{transform:rotate(0)}}
  .wig{position:absolute;inset:0}

  .env-back,.env-front,.flap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .env-back{z-index:1}
  .card{position:absolute;z-index:2;left:6%;top:4%;width:88%;aspect-ratio:1080/1554;
    background:var(--butter);border:3px solid var(--plum);border-radius:12px;padding:3.2%;
    box-shadow:0 10px 30px -10px rgba(30,30,70,.5);
    transition:transform 1s cubic-bezier(.4,0,.2,1)}
  .card video{display:block;width:100%;height:100%;object-fit:cover;border-radius:7px;background:var(--blue)}
  .rise .card{transform:translateY(calc(var(--w) * -.9))}
  .env-front{z-index:3}
  .wig::before{content:"";position:absolute;inset:0;border-radius:5%/3.5%;box-shadow:0 14px 26px -6px rgba(30,40,80,.4)}
  .flap{position:absolute;inset:0;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
    transform:perspective(900px) rotateX(0);transition:transform .75s cubic-bezier(.5,0,.3,1)}
  .flap svg{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .flap .inner{transform:rotateX(180deg)}
  .open .flap{transform:perspective(900px) rotateX(180deg)}
  .open.behind .flap{z-index:1}

  .seal{position:absolute;z-index:5;left:50%;top:44.5%;width:26%;transform:translate(-50%,-50%);
    transition:transform .35s cubic-bezier(.5,-0.6,.7,1),opacity .3s ease}
  .idle .seal{animation:beat 1.4s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-50%,-50%) scale(1.13)}30%{transform:translate(-50%,-50%) scale(.97)}45%{transform:translate(-50%,-50%) scale(1.07)}}
  .open .seal{transform:translate(-50%,-50%) scale(1.6) rotate(25deg);opacity:0}

  .to{position:absolute;z-index:4;left:0;right:0;bottom:12%;text-align:center;
    font-family:"Caveat",cursive;font-size:calc(var(--w) * .12);color:var(--plum);transform:rotate(-4deg)}

  .hint{position:absolute;z-index:6;left:50%;bottom:calc(var(--w) * -.24);transform:translateX(-50%);
    font-family:"Caveat",cursive;font-size:clamp(26px,7vw,36px);color:var(--cream);white-space:nowrap;
    text-shadow:0 2px 0 var(--plum),0 -1px 0 var(--plum),1px 0 0 var(--plum),-1px 0 0 var(--plum);
    transition:opacity .3s}
  .hint .arrow{display:inline-block;animation:bob 1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .open .hint{opacity:0}

  .spark{position:absolute;width:calc(var(--w) * .13);height:auto;aspect-ratio:1;z-index:6;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none}
  .open .spark{opacity:0;transition:opacity .3s}

  /* ---------- final card ---------- */
  .card.final{position:fixed;z-index:20;margin:0;transition:none;transform:none}
  .fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
  .fx > *{position:absolute;left:0;top:0;will-change:transform}
  .floaty{position:fixed;bottom:-60px;z-index:10;pointer-events:none;animation:floatUp var(--d) linear forwards}
  @keyframes floatUp{to{transform:translate(var(--dx),-115vh) rotate(var(--rr))}}

  .replay{position:fixed;z-index:25;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    font-family:"Caveat",cursive;font-size:22px;color:var(--plum);background:var(--butter);
    border:2.5px solid var(--plum);border-radius:999px;padding:4px 16px 6px;cursor:pointer;
    opacity:0;transform:translateY(10px);transition:.5s;box-shadow:0 3px 0 var(--plum)}
  .replay.show{opacity:1;transform:none}

  .start{position:fixed;inset:0;z-index:40;display:grid;place-items:center;cursor:pointer;
    background:rgba(84,132,172,.72);transition:opacity .6s ease}
  .start.hide{opacity:0;pointer-events:none}
  .start .inner{text-align:center;display:grid;justify-items:center;gap:6px}
  .start .name{font-family:"Caveat",cursive;font-size:clamp(58px,17vw,96px);line-height:1;color:var(--cream);transform:rotate(-5deg);
    text-shadow:0 3px 0 var(--plum),0 -2px 0 var(--plum),2px 0 0 var(--plum),-2px 0 0 var(--plum),3px 3px 0 var(--plum)}
  .start .btn{width:clamp(96px,26vw,130px);animation:pulse 1.4s ease-in-out infinite}
  .start .tap{font-family:"Caveat",cursive;font-size:clamp(24px,6.5vw,32px);color:var(--cream);
    text-shadow:0 2px 0 var(--plum),0 -1px 0 var(--plum),1px 0 0 var(--plum),-1px 0 0 var(--plum)}
  .start .sub{font-family:"Caveat",cursive;font-size:22px;color:var(--cream);opacity:.85;text-shadow:0 1px 0 var(--plum)}
  @keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.13)}30%{transform:scale(.97)}45%{transform:scale(1.07)}}

  @media (prefers-reduced-motion: reduce){
    .idle .env,.idle .wig,.bgstar,.spark{animation:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star" viewBox="0 0 100 100">
      <path d="M50 5 C53 22 57 33 62 37 C70 39 82 38 95 39 C85 48 75 56 70 62 C72 73 77 85 80 95 C68 87 58 80 50 77 C42 80 31 88 20 95 C24 84 29 72 30 62 C23 55 14 48 5 40 C18 39 31 39 38 37 C43 31 47 20 50 5 Z"
        fill="#fce59f" stroke="#3b1f2b" stroke-width="5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 100 92">
      <path d="M50 88 C40 78 6 58 6 30 C6 13 18 4 30 4 C40 4 47 11 50 20 C53 11 60 4 71 4 C84 4 95 14 94 31 C93 58 60 78 50 88 Z"
        stroke="#3b1f2b" stroke-width="5" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div class="sky" id="sky">
  <div class="cloud">
    <svg viewBox="0 0 400 60" preserveAspectRatio="none">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fc9fc3"/><stop offset=".75" stop-color="#fcb5cf"/><stop offset="1" stop-color="#fce59f"/></linearGradient></defs>
      <path d="M0 0 H400 V34 C390 46 378 46 370 36 C360 48 344 48 336 37 C326 50 309 49 302 38 C292 50 276 50 268 38 C258 49 242 49 234 37 C224 50 208 49 200 38 C190 50 174 49 166 37 C156 49 140 49 132 37 C122 50 106 49 98 37 C88 49 72 48 64 37 C54 49 38 49 30 37 C20 48 8 46 0 36 Z" fill="url(#cg)"/>
    </svg>
  </div>
</div>

<main class="stage" id="stage">
  <!-- envelope sits underneath the papers until they slide away -->
  <div class="envwrap" id="envwrap">
    <div class="env" id="env" role="button" aria-label="Zarfı aç" tabindex="0">
      <div class="wig">
        <svg class="env-back" viewBox="0 0 100 142" preserveAspectRatio="none">
          <rect x="1" y="1" width="98" height="140" rx="5" fill="#e87aa8" stroke="#3b1f2b" stroke-width="1.2"/>
          <!-- liner peeking inside the V -->
          <path d="M3 3 H97 L50 66 Z" fill="#fce59f"/>
          <g fill="#fc9fc3" opacity=".9">
            <circle cx="15" cy="12" r="2.4"/><circle cx="35" cy="20" r="2.4"/><circle cx="55" cy="10" r="2.4"/><circle cx="78" cy="18" r="2.4"/>
            <circle cx="34" cy="34" r="2.4"/><circle cx="52" cy="36" r="2.4"/><circle cx="66" cy="32" r="2.4"/>
            <circle cx="50" cy="52" r="2.4"/>
          </g>
        </svg>

        <div class="card" id="card">
          <video id="vid" src="card.mp4" poster="poster.jpg" muted playsinline loop preload="auto"></video>
        </div>

        <svg class="env-front" viewBox="0 0 100 142" preserveAspectRatio="none">
          <path d="M1 6 Q1 2 4 3 L50 66 L96 3 Q99 2 99 6 V136 Q99 141 94 141 H6 Q1 141 1 136 Z" fill="#fc9fc3" stroke="#3b1f2b" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M3 139 L47 98 Q50 95 53 98 L97 139" stroke="#e87aa8" stroke-width="1" fill="none" stroke-linecap="round"/>
          <!-- little doodles -->
          <use href="#star" x="8" y="108" width="9" height="9"/>
          <use href="#star" x="83" y="112" width="7" height="7"/>
          <use href="#heart" x="80" y="125" width="8" height="7.4" fill="#fce59f"/>
          <use href="#heart" x="12" y="124" width="6" height="5.5" fill="#f47fb0"/>
        </svg>

        <div class="to">sevgilime ♡</div>

        <div class="flap" id="flap">
          <svg viewBox="0 0 100 142" preserveAspectRatio="none">
            <path d="M1 6 Q1 1 6 1 H94 Q99 1 99 6 L54 66 Q50 70 46 66 Z" fill="#f9a8c9" stroke="#3b1f2b" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M8 6 H92" stroke="#fce59f" stroke-width="1" stroke-dasharray="2.5 2.5" fill="none" stroke-linecap="round"/>
          </svg>
          <svg class="inner" viewBox="0 0 100 142" preserveAspectRatio="none">
            <path d="M1 6 Q1 1 6 1 H94 Q99 1 99 6 L54 66 Q50 70 46 66 Z" fill="#fce59f" stroke="#3b1f2b" stroke-width="1.2" stroke-linejoin="round"/>
            <g fill="#fc9fc3"><circle cx="20" cy="12" r="2.4"/><circle cx="42" cy="18" r="2.4"/><circle cx="64" cy="12" r="2.4"/><circle cx="82" cy="16" r="2.4"/><circle cx="50" cy="40" r="2.4"/><circle cx="33" cy="30" r="2.4"/><circle cx="67" cy="30" r="2.4"/></g>
          </svg>
        </div>

        <svg class="seal" viewBox="0 0 100 92"><use href="#heart" fill="#f47fb0"/><path d="M50 66 C44 60 28 50 28 36 C28 28 33 24 39 24 C44 24 48 28 50 32 C52 28 56 24 61 24 C67 24 72 28 72 36 C72 50 56 60 50 66 Z" fill="#fce59f" opacity=".95"/></svg>

        <svg class="spark" viewBox="0 0 100 100" style="left:-12%;top:8%"><use href="#star"/></svg>
        <svg class="spark" viewBox="0 0 100 100" style="right:-13%;top:30%;animation-delay:-.6s"><use href="#star"/></svg>
        <svg class="spark" viewBox="0 0 100 100" style="left:-8%;bottom:16%;width:calc(var(--w)*.09);animation-delay:-1.1s"><use href="#star"/></svg>
      </div>
      <div class="hint"><span class="arrow">↑</span> beni aç <span class="arrow" style="animation-delay:-.5s">↑</span></div>
    </div>
  </div>

  <section class="paper" id="p2">
    <div class="tape butter" style="--tr:3deg"></div>
    <svg class="doodle" viewBox="0 0 100 100" style="right:6%;bottom:5%"><use href="#star"/></svg>
    <svg class="doodle" viewBox="0 0 100 100" style="left:7%;top:8%;width:8%"><use href="#star"/></svg>
    <div class="msg" data-lines="İLK HEDİYENİ|BURADAN|VERİYORUM|*SEVGİLİM"></div>
  </section>

  <section class="paper" id="p1">
    <div class="tape"></div>
    <svg class="doodle" viewBox="0 0 100 100" style="left:6%;bottom:6%"><use href="#star"/></svg>
    <svg class="doodle" viewBox="0 0 100 100" style="right:8%;top:9%;width:8%"><use href="#star"/></svg>
    <div class="msg" data-lines="GEÇ OLSUN|GÜÇ OLMASIN"></div>
  </section>
</main>

<audio id="music" src="music.m4a" loop preload="auto"></audio>
<div class="fx" id="fx"></div>
<button class="replay" id="replay">↺ baştan</button>

<div class="start" id="start" role="button" aria-label="Başla" tabindex="0">
  <div class="inner">
    <div class="name">Berk'e ♡</div>
    <svg class="btn" viewBox="0 0 100 92"><use href="#heart" fill="#fc9fc3"/><path d="M50 66 C44 60 28 50 28 36 C28 28 33 24 39 24 C44 24 48 28 50 32 C52 28 56 24 61 24 C67 24 72 28 72 36 C72 50 56 60 50 66 Z" fill="#fce59f"/></svg>
    <div class="tap">dokun</div>
    <div class="sub">sesi aç 🔊</div>
  </div>
</div>

<script>
(() => {
  const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
  const $ = s => document.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const rnd = (a, b) => a + Math.random() * (b - a);

  // watercolor sky, painted once into a static image (live SVG noise is too heavy for phones)
  (function paintSky() {
    try {
      const W = 540, H = 960, c = document.createElement('canvas');
      c.width = W; c.height = H;
      const x = c.getContext('2d');
      x.fillStyle = '#6096bc'; x.fillRect(0, 0, W, H);
      for (let i = 0; i < 90; i++) {
        const cx = rnd(-50, W + 50), cy = rnd(-50, H + 50), r = rnd(60, 260);
        const light = Math.random() < .55;
        const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, light ? `rgba(160,205,235,${rnd(.08, .2)})` : `rgba(45,85,140,${rnd(.06, .16)})`);
        g.addColorStop(.7, light ? 'rgba(160,205,235,.04)' : 'rgba(45,85,140,.03)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
      }
      const img = x.getImageData(0, 0, W, H), d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - .5) * 16;
        d[i] += n; d[i + 1] += n; d[i + 2] += n;
      }
      x.putImageData(img, 0, 0);
      $('#sky').style.backgroundImage = `url(${c.toDataURL('image/jpeg', .85)})`;
    } catch (e) {}
  })();

  // background stars
  const sky = $('#sky');
  [[6,18,34],[88,12,26],[12,78,30],[84,84,38],[50,6,18],[94,48,20],[3,50,18],[70,94,22],[28,92,16]]
    .forEach(([x, y, s], i) => {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      el.classList.add('bgstar');
      el.setAttribute('viewBox', '0 0 100 100');
      el.style.cssText = `left:${x}%;top:${y}%;--s:${s}px;--d:${rnd(3,5)}s;--dl:${-i * .7}s;translate:-50% -50%`;
      el.innerHTML = '<use href="#star"/>';
      sky.appendChild(el);
    });

  // split each message into tilted, colored letters
  function build(msg) {
    const letters = [];
    let ci = Math.floor(Math.random() * COLORS.length);
    msg.dataset.lines.split('|').forEach(raw => {
      const line = document.createElement('span');
      line.className = 'line';
      const big = raw.startsWith('*');
      if (big) line.classList.add('big');
      raw.replace('*', '').split(' ').forEach(w => {
        const word = document.createElement('span');
        word.className = 'word';
        [...w].forEach(c => {
          const ch = document.createElement('span');
          ch.className = 'ch';
          ch.textContent = c;
          ch.style.setProperty('--col', COLORS[ci++ % COLORS.length]);
          ch.style.setProperty('--rot', rnd(-9, 9).toFixed(1) + 'deg');
          ch.style.setProperty('--y', rnd(-.06, .06).toFixed(2) + 'em');
          ch.style.setProperty('--t', rnd(.13, .22).toFixed(2) + 's');
          word.appendChild(ch);
          letters.push(ch);
        });
        line.appendChild(word);
      });
      msg.appendChild(line);
    });
    return letters;
  }

  const l1 = build($('#p1 .msg'));
  const l2 = build($('#p2 .msg'));

  // flourishes
  $('#p1 .msg').insertAdjacentHTML('beforeend',
    '<svg class="squiggle" viewBox="0 0 200 20"><path d="M5 12 C25 2 35 20 55 10 S85 2 105 11 S140 20 160 9 S185 4 195 10"/></svg>');
  $('#p2 .line.big').insertAdjacentHTML('beforeend',
    '<svg class="heartdraw" viewBox="0 0 100 92"><path d="M50 86 C40 76 7 57 7 30 C7 14 18 5 30 5 C40 5 47 12 50 21 C53 12 60 5 71 5 C83 5 94 14 93 31 C92 57 60 76 50 86 Z"/></svg>');
  document.querySelectorAll('.squiggle path, .heartdraw path').forEach(p => {
    p.style.setProperty('--len', Math.ceil(p.getTotalLength() + 2));
  });

  // ---------- sound (synthesized, no files) ----------
  let ac, master, noiseBuf;
  function audio() {
    if (!ac) {
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'playback';   // iOS: play even on silent switch
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = .9;
        const comp = ac.createDynamicsCompressor();
        master.connect(comp).connect(ac.destination);
        const n = ac.sampleRate * 2;
        noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noiseSrc(a, t, dur) {
    const src = a.createBufferSource();
    src.buffer = noiseBuf;
    src.start(t, rnd(0, 1.5));
    src.stop(t + dur + .1);
    return src;
  }
  function filter(a, type, f, q = 1) {
    const b = a.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b;
  }


  // paper sliding across a table
  function whoosh(dur = .9, vol = .35) {
    const a = audio(); if (!a) return;
    const t = a.currentTime, g = a.createGain(), lp = filter(a, 'bandpass', 500, .7);
    lp.frequency.setValueAtTime(400, t);
    lp.frequency.exponentialRampToValueAtTime(2200, t + dur * .45);
    lp.frequency.exponentialRampToValueAtTime(500, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + dur * .4);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    noiseSrc(a, t, dur).connect(lp).connect(g).connect(master);
  }

  // crinkly paper
  function rustle(dur = .5, vol = .3) {
    const a = audio(); if (!a) return;
    const t = a.currentTime, g = a.createGain();
    g.gain.setValueAtTime(0, t);
    for (let x = 0; x < dur; x += .022) g.gain.setValueAtTime(Math.random() < .45 ? vol * rnd(.3, 1) : vol * .05, t + x);
    g.gain.setValueAtTime(0, t + dur);
    noiseSrc(a, t, dur).connect(filter(a, 'bandpass', 2000, .6)).connect(g).connect(master);
  }

  // soft pop on the first tap
  function pop(vol = .5) {
    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(160, t + .12);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .18);
    o.connect(g).connect(master); o.start(t); o.stop(t + .2);
  }


  // background song: already mixed quiet in the file (iOS ignores element volume)
  const music = $('#music');
  function playMusic() {
    if (!music.paused) return;
    music.volume = .8;
    music.play().catch(() => {});
  }

  async function write(letters) {
    for (const ch of letters) {
      ch.classList.add('on');
      await wait(parseFloat(ch.style.getPropertyValue('--t')) * 1000 * .78 + rnd(10, 50));
    }
  }


  async function intro() {
    try { await Promise.race([document.fonts.ready, wait(1200)]); } catch (e) {}
    await wait(700);
    await write(l1);
    $('#p1 .squiggle').classList.add('drawn');
    await wait(1700);
    $('#p1').classList.add('out-left');
    rustle(.18, .25); whoosh(1);
    await wait(650);
    await write(l2);
    $('#p2 .heartdraw').classList.add('drawn');
    await wait(2000);
    $('#p2').classList.add('out-right');
    rustle(.18, .25); whoosh(1);
    await wait(450);
    $('#envwrap').classList.add('show', 'idle');
  }

  // ---------- opening ----------
  const env = $('#env'), envwrap = $('#envwrap'), card = $('#card'), vid = $('#vid'), fx = $('#fx');
  let opened = false;

  function finalRect() {
    const vw = innerWidth, vh = innerHeight;
    const ar = card.offsetWidth / card.offsetHeight;
    let h = Math.min(vh * .86, (vw * .9) / ar);
    let w = h * ar;
    return { left: (vw - w) / 2, top: (vh - h) / 2 - vh * .01, width: w, height: h };
  }

  function burst(cx, cy, n = 34) {
    const shapes = ['#star', '#heart'];
    const fills = ['#fce59f', '#fc9fc3', '#f47fb0', '#9cc73a', '#f39a3d', '#b48ce0'];
    for (let i = 0; i < n; i++) {
      const s = rnd(14, 30);
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      const id = shapes[i % 2];
      el.setAttribute('viewBox', id === '#star' ? '0 0 100 100' : '0 0 100 92');
      el.style.width = el.style.height = s + 'px';
      el.innerHTML = `<use href="${id}" fill="${fills[i % fills.length]}"/>`;
      fx.appendChild(el);
      const a = rnd(0, Math.PI * 2), d = rnd(120, Math.min(innerWidth, innerHeight) * .62);
      const x = Math.cos(a) * d, y = Math.sin(a) * d - 40;
      el.animate([
        { transform: `translate(${cx - s/2}px,${cy - s/2}px) scale(.2) rotate(0)`, opacity: 1 },
        { transform: `translate(${cx + x*.85 - s/2}px,${cy + y*.85 - s/2}px) scale(1.1) rotate(${rnd(-200,200)}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${cx + x - s/2}px,${cy + y + 160 - s/2}px) scale(.8) rotate(${rnd(-360,360)}deg)`, opacity: 0 }
      ], { duration: rnd(1500, 2400), easing: 'cubic-bezier(.15,.7,.3,1)' }).onfinish = () => el.remove();
    }
  }

  function floaties() {
    let count = 0;
    const tick = () => {
      if (count++ > 400) return;
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      const heart = Math.random() < .55;
      el.setAttribute('viewBox', heart ? '0 0 100 92' : '0 0 100 100');
      el.classList.add('floaty');
      const s = rnd(12, 26);
      el.style.cssText = `left:${rnd(0, 100)}vw;width:${s}px;height:${s}px;--d:${rnd(9, 15)}s;--dx:${rnd(-60, 60)}px;--rr:${rnd(-90, 90)}deg;opacity:${rnd(.55, .9)}`;
      el.innerHTML = `<use href="${heart ? '#heart' : '#star'}" fill="${heart ? '#fc9fc3' : '#fce59f'}"/>`;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
      setTimeout(tick, rnd(700, 1400));
    };
    tick();
  }

  async function open() {
    if (opened || !envwrap.classList.contains('show')) return;
    opened = true;
    envwrap.classList.remove('idle');
    playMusic();
    // unlock playback inside the tap gesture, but keep the first frame showing while it rises
    vid.play().then(() => { vid.pause(); vid.currentTime = 0; }).catch(() => {});
    envwrap.classList.add('open');
    await wait(420);
    envwrap.classList.add('behind');      // flap tucks behind the card once past vertical
    await wait(380);
    envwrap.classList.add('rise', 'sink');
    await wait(1050);

    // FLIP: lift the card out of the envelope into its own fixed layer
    const r0 = card.getBoundingClientRect();
    const r1 = finalRect();
    document.body.appendChild(card);
    card.classList.add('final');
    Object.assign(card.style, { left: r1.left + 'px', top: r1.top + 'px', width: r1.width + 'px', height: r1.height + 'px' });
    const sx = r0.width / r1.width;
    card.animate([
      { transform: `translate(${r0.left - r1.left}px,${r0.top - r1.top}px) scale(${sx})`, transformOrigin: '0 0' },
      { transform: 'translate(0,0) scale(1.03) rotate(-1deg)', transformOrigin: '0 0', offset: .75 },
      { transform: 'none', transformOrigin: '0 0' }
    ], { duration: 1000, easing: 'cubic-bezier(.3,.8,.3,1)' });
    envwrap.classList.remove('sink');
    envwrap.classList.add('gone');
    vid.currentTime = 0; vid.play().catch(() => {});
    setTimeout(() => burst(innerWidth / 2, innerHeight / 2), 350);
    setTimeout(floaties, 900);
    setTimeout(() => $('#replay').classList.add('show'), 2500);
  }

  env.addEventListener('click', open);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  $('#replay').addEventListener('click', () => location.reload());

  addEventListener('resize', () => {
    if (!card.classList.contains('final')) return;
    const r = finalRect();
    Object.assign(card.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  });

  // #zarf skips straight to the envelope
  if (location.hash === '#zarf') {
    $('#p1').remove(); $('#p2').remove();
    $('#envwrap').classList.add('show', 'idle');
    $('#start').remove();
  } else {
    const start = $('#start');
    const go = () => {
      if (start.classList.contains('hide')) return;
      audio(); pop(.35); playMusic();
      start.classList.add('hide');
      setTimeout(() => start.remove(), 700);
      intro();
    };
    start.addEventListener('click', go);
    start.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  }
})();
</script>
</body>
</html>
